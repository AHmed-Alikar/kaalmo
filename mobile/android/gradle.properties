# Sized to fit an ~8 GB machine — the previous -Xmx8G -XX:MaxMetaspaceSize=4G
# (up to 12 GB for one JVM) crashed the Gradle daemon with a native OOM during
# `assembleRelease`. 2 GB heap is ample for R8/D8 on this app.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation breaks when the pub cache (C:) and the project (D:)
# live on different Windows drives: RelocatableFileToPathConverter throws
# "this and base files have different roots". Disable it — full compilation is
# unaffected and plugin modules are tiny.
kotlin.incremental=false
