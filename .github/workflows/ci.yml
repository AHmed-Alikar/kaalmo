name: Kaalmo Continuous Integration (CI)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test Backend Node.js Server
  # -------------------------------------------------------------
  test-server:
    name: Test Server (Node.js & Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          JWT_ACCESS_SECRET: ci_test_access_secret_123456789
          JWT_REFRESH_SECRET: ci_test_refresh_secret_123456789

  # -------------------------------------------------------------
  # Job 2: Lint & Build Frontend React Client
  # -------------------------------------------------------------
  build-client:
    name: Lint & Build Client (React & Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (OxLint)
        run: npm run lint

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api/v1

  # -------------------------------------------------------------
  # Job 3: Test & Analyze Mobile App (Flutter)
  # -------------------------------------------------------------
  test-mobile:
    name: Test & Analyze Mobile (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test
