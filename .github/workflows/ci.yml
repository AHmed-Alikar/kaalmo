
name: Kaalmo CI and Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and Build Kaalmo
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Run Backend Tests
        working-directory: server
        run: npm test
        env:
          JWT_ACCESS_SECRET: ci_test_access_secret_123456789
          JWT_REFRESH_SECRET: ci_test_refresh_secret_123456789

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Linter
        working-directory: client
        run: npm run lint

      - name: Build Frontend
        working-directory: client
        run: npm run build

      - name: Install Production Backend Dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Pack Kaalmo Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release/server release/client
          cp -r server/src server/package.json server/package-lock.json server/node_modules release/server/
          cp -r client/dist release/client/
          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz | cut -d ' ' -f 1 > release.sha256
          echo "Release size:"
          du -h release.tar.gz

      - name: Upload Release Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 7
