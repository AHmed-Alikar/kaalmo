version: '3.8'

services:
  # -------------------------------------------------------------
  # MongoDB Database Service (Local Container / Development)
  # -------------------------------------------------------------
  mongo:
    image: mongo:7-jammy
    container_name: kaalmo-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kaalmo
    volumes:
      - mongo-data:/data/db

  # -------------------------------------------------------------
  # Node.js Express Backend Service
  # -------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kaalmo-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/kaalmo}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_12345}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 30d
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - mongo
    volumes:
      - uploads-data:/app/uploads

  # -------------------------------------------------------------
  # React Web Frontend Service
  # -------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kaalmo-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

# Persistent Volumes
volumes:
  mongo-data:
  uploads-data:
